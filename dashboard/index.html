<title>Project Dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --border: rgba(11,11,11,0.12); --accent: #2a78d6; --critical: #b42f2f;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --border: rgba(255,255,255,0.12); --accent: #3987e5; --critical: #e66767; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
form[hidden] { display: none; }
img { width: 56px; height: 56px; border-radius: 13px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
.sub { color: var(--ink-2); font-size: 13px; margin: -8px 0 4px; }
input[type="password"] {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; width: 100%;
}
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.remember { display: flex; gap: 8px; align-items: center; color: var(--ink-2); font-size: 14px; }
label.remember input { width: 18px; height: 18px; accent-color: var(--accent); }
button {
  font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0;
  border-radius: 10px; padding: 11px; cursor: pointer;
}
button:disabled { opacity: .6; cursor: progress; }
.err { color: var(--critical); font-size: 13px; min-height: 1.2em; margin: 0; }
.loading { color: var(--muted); font-size: 14px; }
</style>
</head>

const STORE = "dash-key-v1";
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function deriveKey(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iterations },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}

async function reveal(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  const html = new TextDecoder().decode(plain);
  document.open();
  document.write(html);
  document.close();
}

async function tryRemembered() {
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch {}
  if (!saved) return false;
  try {
    const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
    await reveal(key);
    return true;
  } catch {
    // The password changed since this device remembered it.
    try { localStorage.removeItem(STORE); } catch {}
    return false;
  }
}

(async () => {
  let linkFailed = false;
  if (location.hash === "#lock") {
    try { localStorage.removeItem(STORE); } catch {}
    history.replaceState(null, "", location.pathname);
  } else if (await tryRemembered()) {
    return;
  } else if (location.hash.length > 1) {
    // The passphrase can ride in the link (https://…/dashboard/#passphrase). The fragment never
    // leaves the device, so the home-screen bookmark opens straight into the dashboard.
    try {
      const key = await deriveKey(decodeURIComponent(location.hash.slice(1)));
      await reveal(key);
      try { localStorage.setItem(STORE, toB64(await crypto.subtle.exportKey("raw", key))); } catch {}
      return;
    } catch {
      linkFailed = true;
    }
  }
  document.getElementById("loading").hidden = true;
  if (linkFailed) document.getElementById("err").textContent = "リンクの合言葉が違います。パスワードを入力してください。";
  const form = document.getElementById("form");
  form.hidden = false;
  document.getElementById("pw").focus();
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const go = document.getElementById("go"), err = document.getElementById("err");
    go.disabled = true; go.textContent = "確認中…"; err.textContent = "";
    try {
      const key = await deriveKey(document.getElementById("pw").value);
      if (document.getElementById("remember").checked) {
        try { localStorage.setItem(STORE, toB64(await crypto.subtle.exportKey("raw", key))); } catch {}
      }
      await reveal(key);
    } catch {
      try { localStorage.removeItem(STORE); } catch {}
      err.textContent = "パスワードが違います。";
      go.disabled = false; go.textContent = "開く";
    }
  });
})();
})();
